<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Coco Mogu and Fried Noodles logo: a happy face sipping">
  <!-- badge -->
  <circle cx="100" cy="100" r="98" fill="#2F6B3A"/>
  <circle cx="100" cy="100" r="89" fill="none" stroke="#FBF4E6" stroke-width="3" stroke-dasharray="0.1 8" stroke-linecap="round"/>

  <!-- face -->
  <circle cx="100" cy="104" r="62" fill="#FBF4E6" stroke="#1E2A1B" stroke-width="6"/>

  <!-- relaxed raised eyebrows -->
  <path d="M66 74 q10 -6 20 -2" fill="none" stroke="#1E2A1B" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M114 72 q10 -4 20 2" fill="none" stroke="#1E2A1B" stroke-width="4.5" stroke-linecap="round"/>

  <!-- eyes closed, enjoying the sip -->
  <path d="M68 92 q9 9 18 0" fill="none" stroke="#1E2A1B" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M114 92 q9 9 18 0" fill="none" stroke="#1E2A1B" stroke-width="5.5" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="66" cy="114" rx="10" ry="6" fill="#2F6B3A" opacity="0.25"/>
  <ellipse cx="134" cy="114" rx="10" ry="6" fill="#2F6B3A" opacity="0.25"/>

  <!-- cheeks sucked in -->
  <path d="M84 118 q-5 8 0 16" fill="none" stroke="#1E2A1B" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M116 118 q5 8 0 16" fill="none" stroke="#1E2A1B" stroke-width="3.5" stroke-linecap="round"/>

  <!-- puckered sipping lips -->
  <ellipse cx="100" cy="127" rx="9" ry="8.5" fill="#FBF4E6" stroke="#1E2A1B" stroke-width="5.5"/>
  <ellipse cx="100" cy="127.5" rx="2.6" ry="2.4" fill="#1E2A1B"/>

  <!-- little sip sparkle -->
  <path d="M154 46 v14 M147 53 h14" stroke="#FBF4E6" stroke-width="4" stroke-linecap="round"/>
  <path d="M168 70 v8 M164 74 h8" stroke="#FBF4E6" stroke-width="3" stroke-linecap="round"/>
</svg>
